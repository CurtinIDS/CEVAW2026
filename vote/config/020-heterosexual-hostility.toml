[vote]
column = "sexism_heterosexual_hostility"
columns = ["body"]
query = "maybe_sexist > 0"
thinking = true
model = "accurate"
batch-size = 100
prompt = '''
=== TASK ===
You will read a text from the Australian Parliament's Hansard. It may
contain speeches, questions, answers and interjections. The text may
already have been judged to be sexist. Your ONLY job is to decide whether
it contains one specific, narrow form of sexism: HETEROSEXUAL HOSTILITY.

=== IMPORTANT ===
Sexism takes many forms. This task is about HETEROSEXUAL HOSTILITY ONLY.
A text can be clearly sexist and still NOT contain HETEROSEXUAL HOSTILITY.
- If the text contains HETEROSEXUAL HOSTILITY, answer 1, even if it is also sexist in
  other ways.
- If the text is sexist in some other way but does not contain HETEROSEXUAL HOSTILITY,
  answer 0.
- If the text is not sexist at all, answer 0.

=== BACKGROUND ===
Sexism toward women can be HOSTILE (openly negative toward women) or
BENEVOLENT (it sounds kind or flattering, but still treats women as a
class in a stereotyped way). Benevolent sexism still counts as sexism,
even when the speaker means well and even when it is used to argue for
something that helps women. HETEROSEXUAL HOSTILITY is a form of hostile sexism.

=== HOW TO DECIDE ===
1. The statement must be about women as a group ("women are...", "the
   fairer sex"), or about a particular woman BECAUSE she is a woman.
2. The speaker must be stating the view as their own. Interjections
   recorded in Hansard count. If a speaker quotes or reports a sexist
   remark in order to criticise it, that is not sexism by the speaker.
3. One qualifying statement is enough. The rest of the text can be
   neutral.
4. Ask: does this statement rely on a belief about what women are
   naturally like, what they can do, or where they belong?
5. Then check that the statement matches the definition of HETEROSEXUAL HOSTILITY
   below. Being sexist is not enough on its own.

=== THESE ARE NOT SEXISM ON THEIR OWN ===
- Discussing policy that affects women (parental leave, domestic violence
  services, women's health, the pay gap), or giving statistics about women.
- Saying that women face discrimination or barriers, or calling for equal
  treatment.
- Criticising a female member's policies or performance in the same way a
  man would be criticised.
- Opposing a policy such as gender quotas, as long as women are not
  portrayed as incompetent or as seeking unfair advantage.
- Thanking or praising a specific woman (wife, mother, colleague) without
  any claim about women in general.
- Facts of biology (pregnancy, childbirth, breastfeeding).
- Formal address such as "Madam Speaker".
- Negative statements about men (out of scope).

=== DEFINITION: HETEROSEXUAL HOSTILITY ===
Women's sexuality or romantic relationships are framed as something women
use to manipulate, exploit, trap or control men.
This includes:
- women using sex or looks to get ahead;
- women teasing men and then rejecting them;
- a woman "putting a man on a leash" once he commits;
- women in general making false accusations of abuse or assault to
  punish or control men;
- degrading sexual remarks about women or about a female member.
Key test: does the statement treat women's sexuality or relationships
with men as a weapon, or reduce a woman to a sexual object?

=== WORKED EXAMPLES: CONTAINS HETEROSEXUAL HOSTILITY ===
Text: "We all know how some women in this building climbed the ladder, and
it was not on the strength of their policy work."
Answer: 1
Why: Implies women advance through sex.

Text: "Too many women use false domestic violence claims as a weapon in the
Family Court to cut fathers out of their children's lives."
Answer: 1
Why: Women in general portrayed as using relationships to harm and control
men.

Text: "The minister might win more votes if she wore a shorter skirt."
Answer: 1
Why: A degrading sexual remark about a woman.

Text: "Once a woman has a ring on her finger, the poor husband is kept on a
very short leash."
Answer: 1
Why: Women use the relationship to control men.

=== WORKED EXAMPLES: DOES NOT CONTAIN HETEROSEXUAL HOSTILITY ===
(Some of these are sexist, but not in this specific way.)

Text: "Under this quota scheme, women will be handed seats they could never
win on merit."
Answer: 0
Why: Sexist, but not in this way. It is about merit, not about sex or
relationships.

Text: "Whatever a man achieves in public life, he is not a whole man until
he has the love of a good woman."
Answer: 0
Why: Sexist, but not in this way. It is about relationships, but it
presents women positively, not as manipulating men.

Text: "The Family Court needs strong safeguards so that a false allegation
by either parent is identified quickly."
Answer: 0
Why: Gender-neutral, with no claim about women. Not sexist.

Text: "Sexual harassment of female staff in Parliament House must end."
Answer: 0
Why: Condemns harassment. Not sexist.
'''
