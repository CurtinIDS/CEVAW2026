[vote]
column = "gender_swap_women"
columns = ["body"]
thinking = false
model = "balanced"
batch-size = 500
query = "maybe_gendered > 0"
prompt = '''
=== TASK: THE GROUP-SWAP TEST ===
You will read a text from the Australian Parliament's Hansard. It may contain speeches, questions, answers and interjections. Speaker and addressee details have been removed, so judge only the words in the text.

Your job is to decide whether the text contains a statement about women that fails the group-swap test described below. You are not judging whether the text is sexist in general. Only the group-swap test counts.

=== WHO COUNTS AS women ===
Treat any of the following as references to women:

women, woman, girls, girl, ladies, lady, females, female (as a noun or adjective), mothers, mums, wives, wife, daughters, sisters, grandmothers, housewives, "working mums", sheilas, "the girls", "the fairer sex", "the gentler sex".

This includes references to women as a whole group and to a subgroup of women, such as an occupation or age group. It also includes a statement about an individual, but only when the speaker links the statement to that person being a woman (for example, "as a woman, the minister naturally...").

=== WHAT THE GROUP-SWAP TEST IS ===
For each statement about women, rewrite it in your head with men in place of women. Swap any related words too, such as mothers and fathers, girls and boys, wives and husbands, or she and he. Then compare the two versions.

The test works by exposing double standards. A generalisation about women can sound normal because it is familiar. When the same statement is made about men, the assumption behind it becomes obvious, and the swapped version sounds odd or insulting.

- If the swapped version sounds just as reasonable as the original, the statement PASSES the test.
- If the swapped version sounds odd or insulting, ask why. If it is because the original relies on a generalisation about women as a group, the statement FAILS the test. If it is only because of biology or a documented fact, the statement PASSES (see "Statements of fact" below).

=== WHEN THE SWAPPED VERSION SOUNDS WRONG ===
A statement fails the test when it does at least one of these:
- attributes a nature, temperament, ability, preference or motive to women as a group;
- assigns women a role, duty or place because of their sex;
- holds women to a standard that would not be applied to men;
- praises or criticises women in a way that only makes sense because of a stereotype about their sex.

The swap commonly exposes generalisations such as these:

- women are naturally more caring, nurturing, gentle, compassionate, moral or emotional than men;
- women are less capable, rational or qualified, or owe their positions to targets or quotas rather than merit;
- women naturally suit particular roles, such as caring for children or home duties, or naturally avoid others, such as engineering, leadership or finance;
- women need protection, provision or guidance from men;
- women are valued for their appearance or as decoration rather than for their work;
- women have particular interests or tastes, such as fashion or décor, because they are women;
- women as a group share particular motives, such as using relationships to gain advantage.

Polite, affectionate or complimentary statements can fail the test. A positive tone does not make a generalisation acceptable. Hedges such as "on average", "generally" or "let's be honest" do not make it acceptable either.

=== STATEMENTS THAT PASS THE TEST (ANSWER 0) ===
Some statements may be sexist in other ways but still pass the group-swap test, because the swapped version sounds just as reasonable as the original. Answer 0 for these. Other prompts will check for them separately. They include:
- denying or minimising discrimination or disadvantage (for example, "the pay gap is just the result of career choices");
- dismissing complaints, or criticising advocates or campaigners, when the swapped version sounds like ordinary political argument;
- remarks about an individual's looks, emotions or behaviour that do not link the remark to them being a woman.

=== STATEMENTS OF FACT DO NOT COUNT ===
Do not flag statements that describe biology, documented circumstances or measured outcomes, even if they mention women specifically and even if the swapped version sounds strange. These include:
- biology, such as pregnancy, childbirth, breastfeeding, menstruation, menopause, and sex-specific cancers and health conditions;
- documented circumstances, such as rates of violence, victimisation, workplace injury, suicide, homelessness, unemployment or underrepresentation;
- measured outcomes, such as pay gaps, retirement savings gaps, life expectancy or educational results;
- the reported experiences of women (for example, "many women tell me they feel unsafe").

The key distinction is circumstance versus essence. "women are more likely to experience X" describes a circumstance and passes. "women are naturally X" or "women need X because of what they are" describes an essence and fails.

However, a fact used to justify a generalisation still fails. Mentioning childbirth is fine. Arguing that because women give birth they belong at home is not.

=== OTHER THINGS THAT DO NOT COUNT ===
- Policies, programs or funding aimed at women (for example, health screening, support services or scholarships), unless the justification relies on a generalisation about women.
- Quoting, reporting or criticising someone else's statement. Only flag statements the speaker themselves makes or endorses.
- Gendered titles and forms of address (for example, Madam Speaker, Mr President, "the honourable member... she"), and ordinary paired phrases such as "mums and dads".
- Disagreement with a policy, argument or person that does not rest on a generalisation about women.

=== HOW TO DECIDE ===
1. Find every statement in the text that refers to women, or to an individual because they are a woman. Most texts will contain none. If so, the answer is 0.
2. Apply the swap to each statement.
3. If the swapped version sounds just as reasonable as the original, the statement passes. Answer 0 for it, even if you think it may be sexist in some other way.
4. If the swapped version sounds odd or insulting, decide why. It fails only if the reason is a generalisation about women as a group. If the reason is biology or documented fact, it passes.
5. Check the exclusions above.
6. Answer 1 if at least one statement clearly fails the test. Answer 0 otherwise.

Statements that fail this test are rare. If you are genuinely unsure, answer 0. A single sentence is enough for a 1, but the overall topic or tone of a text is not.

=== EXAMPLES ===

FAILS THE GROUP-SWAP TEST (ANSWER 1):

"We need more women on our boards, because they bring a nurturing, consensus-building style that the boardroom is missing."
Swap: "We need more men on our boards, because they bring a nurturing, consensus-building style..." sounds odd.
Reason: attributes an innate temperament to women. Praise for warmth stands in for competence.

"We should be careful about promoting women just to meet a target when the best candidate might be overlooked."
Swap: "We should be careful about promoting men just to meet a target..." sounds odd.
Reason: assumes women selected under targets are not the best candidates.

"Girls just aren't drawn to engineering, and no amount of funding will change their nature."
Swap: "Boys just aren't drawn to engineering, and no amount of funding will change their nature." sounds odd.
Reason: treats a career preference as an inherent trait of girls.

"A woman's place is with her children, and this policy finally recognises that."
Swap: "A man's place is with his children..." sounds odd.
Reason: assigns a role based on sex.

"This package means mums can finally afford to go back to work part-time."
Swap: "This package means dads can finally afford to go back to work part-time." sounds odd.
Reason: assumes childcare is the mother's job when the policy applies to all parents.

"Women are the moral backbone of our communities, and this bill honours that."
Swap: "Men are the moral backbone of our communities..." sounds odd.
Reason: attributes inherent moral superiority to women.

"Every woman needs a man she can turn to in hard times, and this law helps husbands and fathers fulfil that role."
Swap: "Every man needs a woman he can turn to in hard times, and this law helps wives and mothers fulfil that role." sounds odd.
Reason: portrays women as needing male protection.

"Women give birth, which is why they are naturally suited to staying home while their husbands provide."
Swap: "Men father children, which is why they are naturally suited to staying home while their wives provide." sounds odd.
Reason: a fact is used to justify assigning a role.

"This is a hard economic question that won't be settled by sentiment, as some of the women opposite seem to think."
Swap: "...as some of the men opposite seem to think." sounds odd.
Reason: implies women reason emotionally.

"The ladies in the gallery will no doubt be more interested in the new colour scheme than the budget figures."
Swap: "The gentlemen in the gallery will no doubt be more interested in the new colour scheme..." sounds odd.
Reason: attributes particular interests to women because they are women.

"As a woman, the minister naturally finds these budget figures confusing."
Swap: "As a man, the minister naturally finds these budget figures confusing." sounds odd.
Reason: attributes a lack of ability to an individual because she is a woman.

"The new female members are a welcome addition; they certainly brighten up the chamber."
Swap: "The new male members are a welcome addition; they certainly brighten up the chamber." sounds odd.
Reason: values women for their appearance rather than their work.

PASSES THE GROUP-SWAP TEST, EVEN IF POSSIBLY SEXIST IN OTHER WAYS (ANSWER 0):

"Women choose lower-paid careers, so the pay gap is not discrimination."
Swap: "Men choose higher-paid careers, so the pay gap is not discrimination." sounds just as reasonable.
Reason: passes. It may deny discrimination, but that is outside this test.

"Discrimination against women in hiring ended decades ago; this bill solves a problem that no longer exists."
Swap: "Discrimination against men in hiring ended decades ago..." sounds just as reasonable.
Reason: passes. Denial of discrimination is outside this test.

"Women already have every opportunity men have; it is up to them to take it."
Swap: "Men already have every opportunity women have; it is up to them to take it." sounds just as reasonable.
Reason: passes.

"A handful of angry feminists do not speak for ordinary mums."
Swap: "A handful of angry men's rights activists do not speak for ordinary dads." sounds like ordinary political argument.
Reason: passes. Criticism of advocates is outside this test.

"The women who succeed in this building don't go running to the media every time someone makes a joke."
Swap: "The men who succeed in this building don't go running to the media every time someone makes a joke." sounds like ordinary political talk.
Reason: passes. Dismissing complaints is outside this test.

"The minister should get her emotions under control before she answers."
Reason: a remark about an individual that does not link her emotions to her being a woman, so there is no group statement to swap. Compare "As a woman, the minister naturally finds these budget figures confusing", which fails.

"The minister might win more votes if she wore a shorter skirt."
Reason: a crude remark about an individual, but it makes no claim about women as a group, so the test does not apply.

NO GENERALISATION, OR A STATEMENT OF FACT (ANSWER 0):

"Women are far more likely than men to experience violence from an intimate partner, and this funding expands crisis accommodation."
Reason: a documented circumstance, not a claim about women's nature.

"Many women in my electorate tell me they do not feel safe walking home at night, and the lighting upgrades in this bill respond to that."
Reason: reported experience and a factual safety concern.

"Only women can give birth, so paid parental leave must include time for physical recovery."
Reason: biology, used for a factual policy point without assigning a role.

"Menopause affects many women in the workforce, and employers should consider flexible arrangements."
Reason: the swap makes it biologically meaningless, not insulting.

"The gender pay gap persists, and this bill requires large employers to publish their figures."
Reason: a measured outcome.

"Women remain underrepresented in this chamber, and that affects how our debates are conducted."
Reason: a documented fact.

"This program funds breast screening for women over fifty."
Reason: a policy aimed at women for a biological reason.

"The member's claim that women belong in the kitchen was disgraceful, and he should withdraw it."
Reason: quoting a statement in order to condemn it.

"Mums and dads across the electorate are feeling the cost of living."
Reason: an ordinary paired phrase with no generalisation.

"Madam Deputy Speaker, I thank the minister for her answer, but I disagree with her conclusions on the budget."
Reason: a title and pronouns only. The disagreement is about the policy.

"I oppose these childcare subsidies because the cost to the budget is unjustified."
Reason: policy disagreement with no generalisation about women.
'''
