[vote]
column = "sexism_competitive_gender_differentiation"
columns = ["body"]
query = "maybe_sexist > 0"
thinking = true
model = "accurate"
batch-size = 100
prompt = '''
=== TASK ===
You will read a text from the Australian Parliament's Hansard. It may
contain speeches, questions, answers and interjections. The text may
already have been judged to be sexist. Your ONLY job is to decide whether
it contains one specific, narrow form of sexism: COMPETITIVE GENDER DIFFERENTIATION.

=== IMPORTANT ===
Sexism takes many forms. This task is about COMPETITIVE GENDER DIFFERENTIATION ONLY.
A text can be clearly sexist and still NOT contain COMPETITIVE GENDER DIFFERENTIATION.
- If the text contains COMPETITIVE GENDER DIFFERENTIATION, answer 1, even if it is also sexist in
  other ways.
- If the text is sexist in some other way but does not contain COMPETITIVE GENDER DIFFERENTIATION,
  answer 0.
- If the text is not sexist at all, answer 0.

=== BACKGROUND ===
Sexism toward women can be HOSTILE (openly negative toward women) or
BENEVOLENT (it sounds kind or flattering, but still treats women as a
class in a stereotyped way). Benevolent sexism still counts as sexism,
even when the speaker means well and even when it is used to argue for
something that helps women. COMPETITIVE GENDER DIFFERENTIATION is a form of hostile sexism.

=== HOW TO DECIDE ===
1. The statement must be about women as a group ("women are...", "the
   fairer sex"), or about a particular woman BECAUSE she is a woman.
2. The speaker must be stating the view as their own. Interjections
   recorded in Hansard count. If a speaker quotes or reports a sexist
   remark in order to criticise it, that is not sexism by the speaker.
3. One qualifying statement is enough. The rest of the text can be
   neutral.
4. Ask: does this statement rely on a belief about what women are
   naturally like, what they can do, or where they belong?
5. Then check that the statement matches the definition of COMPETITIVE GENDER DIFFERENTIATION
   below. Being sexist is not enough on its own.

=== THESE ARE NOT SEXISM ON THEIR OWN ===
- Discussing policy that affects women (parental leave, domestic violence
  services, women's health, the pay gap), or giving statistics about women.
- Saying that women face discrimination or barriers, or calling for equal
  treatment.
- Criticising a female member's policies or performance in the same way a
  man would be criticised.
- Opposing a policy such as gender quotas, as long as women are not
  portrayed as incompetent or as seeking unfair advantage.
- Thanking or praising a specific woman (wife, mother, colleague) without
  any claim about women in general.
- Facts of biology (pregnancy, childbirth, breastfeeding).
- Formal address such as "Madam Speaker".
- Negative statements about men (out of scope).

=== DEFINITION: COMPETITIVE GENDER DIFFERENTIATION ===
Men as a group are said to be better suited than women to high-status,
powerful roles such as politics, leadership, business, the professions or
military command. Women do not belong there.
This also includes treating women's advancement as an unfair contest
against men:
- women seeking special favours under the guise of equality;
- women crying discrimination when they lose fairly;
- feminists wanting power over men rather than equality;
- women appointed under equality measures being assumed less capable.
Key test: does the statement say men are more capable than women in
important roles, or that women's gains are unfair or undeserved?

=== WORKED EXAMPLES: CONTAINS COMPETITIVE GENDER DIFFERENTIATION ===
Text: "Parliament is no place for a woman. Governing requires a firmness of
mind that the female sex does not possess."
Answer: 1
Why: Women unsuited to a high-status role.

Text: "Under this quota scheme, women will be handed seats they could never
win on merit."
Answer: 1
Why: Assumes women cannot succeed on merit.

Text: "Every time a woman misses out on a promotion she cries
discrimination, when the truth is that the better candidate won."
Answer: 1
Why: Women claim discrimination when they lose fairly.

Text: "Feminists are not after equality. They want to see men pushed out of
every boardroom in the country."
Answer: 1
Why: Feminists seeking power over men.

=== WORKED EXAMPLES: DOES NOT CONTAIN COMPETITIVE GENDER DIFFERENTIATION ===
(Some of these are sexist, but not in this specific way.)

Text: "The member for Eastvale is getting hysterical; someone should calm
her down."
Answer: 0
Why: Sexist, but not in this way. It dismisses her as irrational. It does
not say men are more capable in high-status roles or that women's gains
are unfair.

Text: "I will not vote to send our daughters into combat. Women should be
shielded from the brutality of war."
Answer: 0
Why: Sexist, but not in this way. The reason given is protecting women,
not that women are less capable.

Text: "I don't support quotas. I think mentoring and changes to
preselection rules are a better way to get more women standing."
Answer: 0
Why: A policy disagreement that says nothing about women's ability. Not
sexist.

Text: "Women hold only a third of the seats in this chamber, and that
should concern every one of us."
Answer: 0
Why: Recognises under-representation. Not sexist.
'''
