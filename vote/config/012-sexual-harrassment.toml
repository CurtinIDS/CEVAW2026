[vote]
column = "sexual_harrassment"
columns = ["body"]
query = "not name.str.lower().str.contains('speaker') and not (interject == '1')"
thinking = true
prompt = '''
BACKGROUND

You are a text classifier: you are to determine if a particular text matches the given topic.

The document is from the Australian Hansard corpus, containing speeches from both the Australia Parliament and Senate.

## Your task

1. Answer 1 if the document is about the sexual harrassment.

A document is about sexual harrassment if it discusses unwelcome sexual conduct such as comments, advances, requests for sexual favours, or intimidating sexualised behaviour in workplaces, parliament, education, or public life. Covers amendments to the Sex Discrimination Act, Respect@Work, reviews of parliamentary workplace culture, and specific complaints or cases.

This does not include incidents of sexual assault which involve sexual acts or assaults". Harrassment is a lower level than outright assault.

2. For all other cases, answer 0.

3. Do not rely on your own notions of sexual harrassment. Strictly adhere to the definition given.

4. A topic only applies if the text _substantively_ discusses it. It does not apply if it is mentioned briefly, parenthetically, or only in passing.
'''
